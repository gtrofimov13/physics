<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Field Simulation</title>
</head>
<body>
    <h1>WiFi Field Simulation</h1>
    <form method="post">
        <label for="length">Room Length:</label>
        <input type="number" id="length" name="length" placeholder="Enter room length" required>
        <br>
        <label for="frequency">Frequency (GHz):</label>
        <input type="number" step="0.1" id="frequency" name="frequency" placeholder="Enter frequency in GHz" required>
        <br>
        <button type="submit">Simulate</button>
    </form>
    {% if plot_url %}
    <h2>Simulation Result</h2>
    <img src="data:image/png;base64,{{ plot_url }}" alt="Simulation Result">
    {% endif %}
</body>
</html>
