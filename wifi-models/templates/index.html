<!DOCTYPE html>
<html>
<head>
    <title>WiFi Field Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>WiFi Field Simulator</h1>
        
        <div class="explanation">
            This simulator visualizes the electromagnetic field distribution of a WiFi signal in a square room.
            The field strength is shown using colors, where red indicates stronger signal and blue indicates weaker signal.
        </div>

        <form id="simForm">
            <div class="input-group">
                <label for="room_size">Room Size:</label>
                <input type="number" 
                       id="room_size" 
                       name="room_size" 
                       value="101" 
                       min="10" 
                       max="500" 
                       required>
                <span class="unit-label">cm (Min 10, Max 500)</span>
            </div>
            
            <div class="input-group">
                <label>WiFi Frequency:</label>
                <div class="frequency-selector">
                    <div class="frequency-option">
                        <input type="radio" id="freq5" name="frequency" value="5" checked>
                        <label for="freq5">
                            5 GHz
                            <span class="wavelength-info">λ = 6cm</span>
                        </label>
                    </div>
                    <div class="frequency-option">
                        <input type="radio" id="freq24" name="frequency" value="2.4">
                        <label for="freq24">
                            2.4 GHz
                            <span class="wavelength-info">λ = 12.5cm</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <button type="submit" id="submitBtn">Run Simulation</button>
            </div>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Calculating field distribution...</p>
        </div>
        
        <div class="result">
            <img id="resultImage" style="display: none;">
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/simulator.js') }}"></script>
</body>
</html>
